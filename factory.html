<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f26a1b" />
    <title>工厂扫码台 - 事事通校园配送系统</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body data-app-mode="factory" class="role-page factory-page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">厂</div>
        <div>
          <h1>工厂扫码台</h1>
          <p>扫码入库、扫码出库、自动生成送回任务</p>
        </div>
      </div>
      <div class="session-actions">
        <span id="sessionLabel">未连接</span>
        <button id="signOutBtn" class="ghost hidden" type="button">退出</button>
      </div>
    </header>

    <main class="single-layout">
      <section id="loginPanel" class="panel login-card" data-guest-only>
        <h2>工厂登录</h2>
        <p id="authMessage" class="hint">请先登录工厂账号。</p>
        <input id="loginEmail" class="input" placeholder="邮箱" />
        <input id="loginPassword" class="input" placeholder="密码" type="password" />
        <button id="loginBtn" type="button">登录</button>
      </section>

      <section class="workspace hidden" data-auth-only>
        <div class="split factory-grid">
          <section class="panel scanner-panel">
            <div class="card-head scanner-heading">
              <div>
                <h2>连续扫码作业</h2>
                <p class="hint">先选择入库或出库，本轮每扫一件都会自动处理。</p>
              </div>
              <strong id="factoryScanCount" class="scan-count">本轮 0 件</strong>
            </div>
            <div class="scan-mode-picker" aria-label="选择扫码作业模式">
              <button id="factoryInBtn" class="scan-mode-button scan-in" type="button" aria-pressed="false">
                <strong>连续入库</strong>
                <span>扫到即入库</span>
              </button>
              <button id="factoryOutBtn" class="scan-mode-button scan-out" type="button" aria-pressed="false">
                <strong>连续出库</strong>
                <span>扫到即出库并生成送回任务</span>
              </button>
            </div>
            <div id="factoryModeStatus" class="scan-mode-status" role="status">请先选择本轮作业模式</div>
            <video id="scanVideo" class="scan-video" muted autoplay playsinline></video>
            <div class="toolbar wrap">
              <input id="barcodeInput" class="input" placeholder="扫码枪或手动输入水洗标" />
              <button id="manualScanBtn" type="button">处理输入</button>
              <label class="file-button ghost-file">
                拍照识别
                <input id="barcodePhotoInput" type="file" accept="image/*" capture="environment" />
              </label>
              <button id="startScanBtn" class="ghost" type="button">重新打开摄像头</button>
              <button id="toggleTorchBtn" class="ghost hidden" type="button">打开补光灯</button>
              <button id="stopScanBtn" class="ghost" type="button">结束本轮</button>
            </div>
            <p id="scanResult" class="scan-feedback idle" role="status" aria-live="assertive">选择作业模式后将自动打开后置摄像头。</p>
            <section class="scan-history-panel" aria-labelledby="factoryScanHistoryTitle">
              <div class="card-head">
                <h3 id="factoryScanHistoryTitle">最近处理</h3>
                <button id="undoFactoryScanBtn" class="ghost small-btn" type="button" disabled>撤销上一单</button>
              </div>
              <ol id="factoryScanHistory" class="scan-history">
                <li class="empty">本轮还没有处理记录</li>
              </ol>
            </section>
          </section>

          <section class="panel">
            <div class="card-head">
              <h2>待出库物品</h2>
              <button id="refreshFactoryBtn" class="ghost" type="button">刷新</button>
            </div>
            <div id="factoryItemList" class="card-list"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="./app.js?v=20"></script>
  </body>
</html>
