<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f26a1b" />
    <title>配送员工作台 - 事事通校园配送系统</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=65" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body data-app-mode="courier" class="role-page courier-page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">配</div>
        <div>
          <h1>配送员工作台</h1>
          <p>取件任务、送回任务、电话短信、异常处理</p>
        </div>
      </div>
      <div class="session-actions">
        <span id="sessionLabel">未连接</span>
        <button id="signOutBtn" class="ghost hidden" type="button">退出</button>
      </div>
    </header>

    <main class="single-layout">
      <section id="loginPanel" class="panel login-card" data-guest-only>
        <h2>配送员登录</h2>
        <p id="authMessage" class="hint">请先登录配送员账号。</p>
        <input id="loginEmail" class="input" placeholder="邮箱" />
        <input id="loginPassword" class="input" placeholder="密码" type="password" />
        <button id="loginBtn" type="button">登录</button>
      </section>

      <section class="workspace hidden" data-auth-only>
        <div class="panel hero-panel">
          <h2>当前待办路线</h2>
          <p>默认汇总全部未完成取件和补取；到达一栋楼后先送回、再取件，全部完成后进入下一栋。</p>
          <div class="toolbar wrap courier-filterbar">
            <input id="courierSearch" class="input" placeholder="搜索姓名、电话、学校、楼栋、水洗标、物品" />
            <label class="date-filter">
              <span>历史日期（可选）</span>
              <input id="courierPickupDate" class="input compact-input" type="date" autocomplete="off" />
            </label>
            <button id="courierTodayBtn" class="ghost" type="button">全部未完成</button>
            <button id="refreshCourierBtn" type="button">刷新任务</button>
          </div>
        </div>

        <section class="panel courier-route-panel">
          <div id="courierRouteTaskList" class="card-list"></div>
        </section>
      </section>
    </main>

    <dialog id="orderDialog" class="modal">
      <div class="modal-head">
        <h2 id="orderDialogTitle">订单详情</h2>
        <button id="closeOrderDialogBtn" class="ghost" type="button">关闭</button>
      </div>
      <div id="orderDialogBody" class="stack"></div>
    </dialog>

    <dialog id="returnDeliveryDialog" class="modal return-delivery-dialog">
      <div class="modal-head">
        <div>
          <h2>整单已送达</h2>
          <p id="returnDeliverySummary" class="hint">送达照片已保存。</p>
        </div>
        <button class="ghost" type="button" data-close-return-delivery>关闭</button>
      </div>
      <img id="returnDeliveryPhoto" class="return-delivery-photo" alt="送达照片" />
      <p class="hint">下一步点击“发送已送达短信”，手机会打开短信并自动填写学生电话、送达提醒和照片链接。</p>
      <div class="actions return-delivery-dialog-actions">
        <a id="returnDeliverySmsBtn" class="button-link" href="#">发送已送达短信</a>
        <button class="ghost" type="button" data-close-return-delivery>稍后发送</button>
      </div>
    </dialog>

    <script src="./app.js?v=65"></script>
  </body>
</html>
